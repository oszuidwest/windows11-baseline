name: Lint and Format

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils jq

      - name: Lint XML files
        run: |
          echo "Validating XML files..."
          failed=0
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            if ! xmllint --noout "$file" 2>&1; then
              echo "ERROR: $file is not valid XML"
              failed=1
            fi
          done < <(find . -name "*.xml" -type f -print0)
          if [ $failed -eq 1 ]; then
            echo "XML validation failed"
            exit 1
          fi
          echo "All XML files are valid"

      - name: Lint JSON files
        run: |
          echo "Validating JSON files..."
          failed=0
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            if ! jq empty "$file" 2>&1; then
              echo "ERROR: $file is not valid JSON"
              failed=1
            fi
          done < <(find . -name "*.json" -type f -print0)
          if [ $failed -eq 1 ]; then
            echo "JSON validation failed"
            exit 1
          fi
          echo "All JSON files are valid"

      - name: Validate JSON against schema
        run: |
          echo "Validating config.json against schema..."
          cd policies
          npm install -g ajv-cli ajv-formats
          ajv validate -s config.schema.json -d config.json --all-errors
          echo "Schema validation passed"

      - name: Verify policy matrix is up to date
        run: |
          echo "Regenerating policy matrix from config.json and diffing against policies/README.md..."
          chmod +x scripts/ci/generate-policy-matrix.sh
          ./scripts/ci/generate-policy-matrix.sh check

      - name: Check PowerShell formatting
        shell: pwsh
        run: |
          $settingsPath = Join-Path $env:GITHUB_WORKSPACE 'PSScriptAnalyzerSettings.psd1'
          $files = Get-ChildItem -Recurse -Include *.ps1
          $unformatted = @()
          foreach ($file in $files) {
            $content = Get-Content -Path $file.FullName -Raw
            $formatted = Invoke-Formatter -ScriptDefinition $content -Settings $settingsPath
            if ($formatted -ne $content) {
              $unformatted += $file.FullName
              Write-Output "Needs formatting: $($file.FullName)"
            }
          }
          if ($unformatted.Count -gt 0) {
            Write-Error "PowerShell formatting check failed for $($unformatted.Count) file(s). Run Invoke-Formatter locally before pushing."
            exit 1
          }
          Write-Output "All PowerShell scripts are correctly formatted."

      - name: Lint PowerShell scripts
        shell: pwsh
        run: |
          $settingsPath = Join-Path $env:GITHUB_WORKSPACE 'PSScriptAnalyzerSettings.psd1'
          $files = Get-ChildItem -Recurse -Include *.ps1
          $hasErrors = $false

          foreach ($file in $files) {
            Write-Output "`nAnalyzing: $($file.Name)"
            $results = Invoke-ScriptAnalyzer -Path $file.FullName -Settings $settingsPath

            if ($results) {
              $results | ForEach-Object {
                Write-Output "[$($_.Severity)] Line $($_.Line): $($_.Message)"
                Write-Output "   Rule: $($_.RuleName)"
              }

              if ($results | Where-Object { $_.Severity -in 'Error', 'Warning' }) {
                $hasErrors = $true
              }
            }
            else {
              Write-Output "No issues found"
            }
          }

          if ($hasErrors) {
            Write-Error "PSScriptAnalyzer found errors or warnings. Please fix before merging."
            exit 1
          }
