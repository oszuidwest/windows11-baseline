name: Check ODT URL

on:
  schedule:
    # Run every Monday at 9:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  issues: write

jobs:
  check-url:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract and check ODT URL
        id: check
        run: |
          # Extract ODT URL from apps.ps1
          ODT_URL=$(grep -oP 'odtUrl = "\K[^"]+' scripts/apps.ps1)
          echo "Checking URL: $ODT_URL"

          # Check if URL is accessible (HEAD request)
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -I -L "$ODT_URL")
          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "url_broken=true" >> $GITHUB_OUTPUT
            echo "odt_url=$ODT_URL" >> $GITHUB_OUTPUT
            echo "http_status=$HTTP_STATUS" >> $GITHUB_OUTPUT
          else
            echo "url_broken=false" >> $GITHUB_OUTPUT
          fi

      - name: Create issue if URL is broken
        if: steps.check.outputs.url_broken == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Office Deployment Tool URL is broken';
            const body = `The Office Deployment Tool download URL is no longer accessible.

            **URL:** \`${{ steps.check.outputs.odt_url }}\`
            **HTTP Status:** ${{ steps.check.outputs.http_status }}

            Please update the URL in \`scripts/apps.ps1\` with the latest version from:
            https://www.microsoft.com/en-us/download/details.aspx?id=49117`;

            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'odt-url-broken'
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['odt-url-broken', 'maintenance']
              });
              console.log('Issue created');
            } else {
              console.log('Issue already exists, skipping');
            }
